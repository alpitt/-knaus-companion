name: Validate Companion repository

on:
  pull_request:
    branches: [main]
  push:
    branches: [companion-14-sprint-1-validation, companion-14-sprint-2-corpus, companion-14-sprint-3-digital-twin, companion-14-sprint-4-local-reasoning, companion-15-release-candidate, companion-15-sprint-6-owner-records, companion-15-sprint-7-evidence-library, companion-15-sprint-8-systems-explorer, companion-15-sprint-9-change-planning, companion-16-sprint-10-workshop-jobs, companion-16-sprint-11-trip-readiness, companion-17-sprint-12-maintenance-intelligence]

permissions:
  contents: read

jobs:
  validate:
    name: Syntax, tests and content integrity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate production JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking app/assets/js/app-v4.js"
          node --check app/assets/js/app-v4.js || {
            echo "::error file=app/assets/js/app-v4.js::Production JavaScript syntax validation failed."
            exit 1
          }
          node --check app/assets/js/kb-corpus.js || {
            echo "::error file=app/assets/js/kb-corpus.js::Engineering Corpus runtime syntax validation failed."
            exit 1
          }
          node --check scripts/build-kb-index.js || {
            echo "::error file=scripts/build-kb-index.js::Engineering Corpus index generator syntax validation failed."
            exit 1
          }
          node --check app/assets/js/digital-twin.js
          node --check app/assets/js/digital-twin-adapter.js
          node --check scripts/validate-digital-twin.js
          node --check app/assets/js/local-reasoning.js
          node --check app/assets/js/reasoning-safety.js
          node --check app/assets/js/guided-diagnostics.js
          node --check scripts/build-reasoning-index.js
          node --check scripts/validate-reasoning.js
          node --check app/assets/js/owner-records.js
          node --check app/assets/js/record-history.js
          node --check app/assets/js/evidence-links.js
          node --check app/assets/js/digital-twin-owner-overlay.js
          node --check scripts/validate-owner-records.js
          node --check app/assets/js/evidence-file-validation.js
          node --check app/assets/js/evidence-storage.js
          node --check app/assets/js/evidence-library.js
          node --check app/assets/js/evidence-library-ui.js
          node --check scripts/validate-evidence-library.js
          node --check app/assets/js/system-graph.js
          node --check app/assets/js/system-explorer.js
          node --check scripts/validate-system-graph.js
          node --check app/assets/js/change-plans.js
          node --check app/assets/js/change-baseline.js
          node --check app/assets/js/change-impact.js
          node --check app/assets/js/change-readiness.js
          node --check app/assets/js/change-calculations.js
          node --check app/assets/js/change-graph-overlay.js
          node --check app/assets/js/change-planner-ui.js
          node --check scripts/validate-change-plans.js
          node --check app/assets/js/workshop-jobs.js
          node --check app/assets/js/workshop-lifecycle.js
          node --check app/assets/js/workshop-readiness.js
          node --check app/assets/js/workshop-checklists.js
          node --check app/assets/js/workshop-defects.js
          node --check app/assets/js/workshop-commissioning.js
          node --check app/assets/js/inspections.js
          node --check app/assets/js/workshop-owner-overlay.js
          node --check scripts/validate-workshop-jobs.js
          node --check scripts/validate-inspections.js
          for file in app/assets/js/trip*.js; do node --check "$file"; done
          node --check scripts/validate-trips.js
          node --check scripts/validate-trip-templates.js
          for file in app/assets/js/maintenance-*.js app/assets/js/component-maintenance.js app/assets/js/vehicle-health.js; do node --check "$file"; done
          for file in scripts/validate-maintenance*.js scripts/validate-vehicle-health.js; do node --check "$file"; done

      - name: Rebuild deterministic Engineering Canon index
        run: node scripts/build-kb-index.js

      - name: Validate Digital Twin reference data
        run: node scripts/validate-digital-twin.js

      - name: Build and validate local reasoning evidence
        run: |
          node scripts/build-reasoning-index.js
          node scripts/validate-reasoning.js

      - name: Validate owner-record contracts and fixtures
        run: node scripts/validate-owner-records.js

      - name: Validate Evidence Library contracts and fixtures
        run: node scripts/validate-evidence-library.js

      - name: Validate Interactive Systems graph
        run: node scripts/validate-system-graph.js

      - name: Validate change planning contracts and fixtures
        run: node scripts/validate-change-plans.js

      - name: Validate workshop and inspection contracts
        run: |
          node scripts/validate-workshop-jobs.js
          node scripts/validate-inspections.js

      - name: Validate trip and checklist-template contracts
        run: |
          node scripts/validate-trips.js
          node scripts/validate-trip-templates.js

      - name: Validate maintenance intelligence contracts
        run: |
          node scripts/validate-maintenance.js
          node scripts/validate-maintenance-campaigns.js
          node scripts/validate-maintenance-forecast.js
          node scripts/validate-maintenance-parts.js
          node scripts/validate-maintenance-consumables.js
          node scripts/validate-vehicle-health.js

      - name: Run every repository test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          test_files=(tests/*.test.js)
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "::error::No tests/*.test.js files were found."
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            echo "::group::${test_file}"
            if ! node --test "${test_file}"; then
              echo "::error file=${test_file}::Test file failed. Review the preceding Node test output."
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Confirm repository integrity suite ran
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/repository-integrity.test.js || {
            echo "::error file=tests/repository-integrity.test.js::Repository integrity test is missing."
            exit 1
          }
          test -f tests/kb-manifest.test.js || {
            echo "::error file=tests/kb-manifest.test.js::Engineering Canon manifest test is missing."
            exit 1
          }
          test -f tests/kb-corpus.test.js || {
            echo "::error file=tests/kb-corpus.test.js::Engineering Corpus test suite is missing."
            exit 1
          }
          echo "Repository integrity and Engineering Canon validation completed without deployment."
