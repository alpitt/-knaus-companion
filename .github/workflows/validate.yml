name: Validate Companion repository

on:
  pull_request:
    branches: [main]
  push:
    branches: [companion-14-sprint-1-validation, companion-14-sprint-2-corpus, companion-14-sprint-3-digital-twin, companion-14-sprint-4-local-reasoning]

permissions:
  contents: read

jobs:
  validate:
    name: Syntax, tests and content integrity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate production JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking app/assets/js/app-v4.js"
          node --check app/assets/js/app-v4.js || {
            echo "::error file=app/assets/js/app-v4.js::Production JavaScript syntax validation failed."
            exit 1
          }
          node --check app/assets/js/kb-corpus.js || {
            echo "::error file=app/assets/js/kb-corpus.js::Engineering Corpus runtime syntax validation failed."
            exit 1
          }
          node --check scripts/build-kb-index.js || {
            echo "::error file=scripts/build-kb-index.js::Engineering Corpus index generator syntax validation failed."
            exit 1
          }
          node --check app/assets/js/digital-twin.js
          node --check app/assets/js/digital-twin-adapter.js
          node --check scripts/validate-digital-twin.js
          node --check app/assets/js/local-reasoning.js
          node --check app/assets/js/reasoning-safety.js
          node --check app/assets/js/guided-diagnostics.js
          node --check scripts/build-reasoning-index.js
          node --check scripts/validate-reasoning.js

      - name: Rebuild deterministic Engineering Canon index
        run: node scripts/build-kb-index.js

      - name: Validate Digital Twin reference data
        run: node scripts/validate-digital-twin.js

      - name: Build and validate local reasoning evidence
        run: |
          node scripts/build-reasoning-index.js
          node scripts/validate-reasoning.js

      - name: Run every repository test
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          test_files=(tests/*.test.js)
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "::error::No tests/*.test.js files were found."
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            echo "::group::${test_file}"
            if ! node --test "${test_file}"; then
              echo "::error file=${test_file}::Test file failed. Review the preceding Node test output."
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Confirm repository integrity suite ran
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/repository-integrity.test.js || {
            echo "::error file=tests/repository-integrity.test.js::Repository integrity test is missing."
            exit 1
          }
          test -f tests/kb-manifest.test.js || {
            echo "::error file=tests/kb-manifest.test.js::Engineering Canon manifest test is missing."
            exit 1
          }
          test -f tests/kb-corpus.test.js || {
            echo "::error file=tests/kb-corpus.test.js::Engineering Corpus test suite is missing."
            exit 1
          }
          echo "Repository integrity and Engineering Canon validation completed without deployment."
