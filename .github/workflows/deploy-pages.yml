name: Deploy Knaus Companion to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: knaus-companion-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Validate repository application source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/index.html
          node --check app/assets/js/app-v4.js
          node --test tests/vehicle-evidence.test.js
          test "$(find app/chapters -type f -name '*.json' | wc -l)" -eq 44
          test "$(find app/manual/pages -type f | wc -l)" -eq 286
          test -f app/docs/Knaus_Sun_Traveller_Manufacturer_Manual.pdf
          grep -q 'Version 13.8.0' app/index.html
          grep -q 'id="exportElectricalEvidence"' app/index.html
          grep -q 'const STORE_KEY="knaus-ultimate-v1"' app/assets/js/app-v4.js
          grep -q 'schemaVersion:2' app/assets/js/app-v4.js
          grep -q 'const EVIDENCE_STATUSES=' app/assets/js/app-v4.js
          grep -q 'function migrateEvidenceState(' app/assets/js/app-v4.js
          grep -q 'function normaliseEvidence(' app/assets/js/app-v4.js
          grep -q 'function synchroniseProfileEvidence(' app/assets/js/app-v4.js
          grep -q 'function evidenceBadge(' app/assets/js/app-v4.js
          grep -q 'Evidence status<select' app/assets/js/app-v4.js
          grep -q 'function vehicleEvidenceAnswer(' app/assets/js/app-v4.js
          grep -q 'const safetyCopy=state' app/assets/js/app-v4.js
          grep -q 'function parseBackupText(' app/assets/js/app-v4.js
          grep -q 'state:{...state,schemaVersion:2}' app/assets/js/app-v4.js
          grep -q '## Vehicle evidence statuses' README.md
          grep -q '## Data compatibility' README.md
          grep -q 'id="printRefrigerationReport"' app/index.html
          grep -q 'id="exportRefrigerationRuns"' app/index.html
          grep -q 'id="exportRefrigerationEvidence"' app/index.html
